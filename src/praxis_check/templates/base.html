<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Praxis-Check{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
          <rect x="1" y="1" width="20" height="20" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M6 11.5l3.2 3.2L16 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Praxis-Check
      </a>
      <nav aria-label="Hauptnavigation">
        <a href="/" {% if active == "dashboard" %}aria-current="page"{% endif %}>Übersicht</a>
        <a href="/upload" {% if active == "upload" %}aria-current="page"{% endif %}>Quartal prüfen</a>
        <a class="optional" href="/docs">API</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer wrap">
    Synthetische Daten, vereinfachte Regeln. Ersetzt keine echte Abrechnungsprüfung.
  </footer>
</body>
</html>
