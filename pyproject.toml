[project]
name = "praxis-check"
version = "0.1.0"
description = "A small billing-controlling tool for medical practices: it imports a quarterly billing export, checks it against a set of transparent rules, and turns the findings into a readable report."
readme = "README.md"
authors = [
    { name = "karmic", email = "karbemichael@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.0",
    "typer>=0.29.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[project.scripts]
praxis-check = "praxis_check.cli:app"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
