# Used for the alembic command line, e.g. `uv run alembic revision --autogenerate -m "..."`.
# The application itself configures Alembic in code (praxis_check.db.upgrade).
[alembic]
script_location = src/praxis_check/migrations
sqlalchemy.url = sqlite:///praxis_check.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
